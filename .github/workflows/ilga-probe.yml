# Temporary: test run of the bill watcher on this branch. Removed before the PR.
name: ILGA probe
on:
  push:
    branches: [claude/project-thread-7wsh73]
    paths: [.github/workflows/ilga-probe.yml, scripts/bill_watch.mjs]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install --no-save --no-package-lock playwright@1.47.2
      - run: node scripts/bill_watch.mjs --full
      - name: Check a bill page link
        run: |
          cat > u.js <<'JS'
          const { chromium } = require('playwright');
          const d = require('./data/bills.json');
          (async () => {
            const b = await chromium.launch({ channel: 'chrome' }); const p = await b.newPage();
            const u = d.bills[0].url; const r = await p.goto(u, { timeout: 60000 }).catch(e => null);
            console.log('URL', u, r && r.status(), await p.title().catch(() => ''));
            console.log((await p.evaluate(() => document.body.innerText).catch(() => '')).slice(0, 600));
            await b.close();
          })();
          JS
          node u.js || true
      - name: Summary
        run: |
          node -e "const d=require('./data/bills.json');console.log(d.counts, d.general_assemblies, d.files_read);const s={};for(const b of d.bills){s[b.status.replace(/: .*/,'')]=(s[b.status.replace(/: .*/,'')]||0)+1};console.log(s);for(const b of d.bills.slice(0,40))console.log(b.number,b.tags.join(','),'|',b.title,'|',b.status,'|',b.last_action&&b.last_action.date)"
      - name: Save result to the branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/bills.json data/bills-public.json && git commit -m "Test run of the bill watcher" && git push
