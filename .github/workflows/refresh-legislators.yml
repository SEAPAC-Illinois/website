# Keeps data/legislators.json current for the "Find your legislators" lookup.
# Runs every Monday and can be started by hand from the Actions tab.
name: Refresh legislator roster

on:
  schedule:
    - cron: "17 11 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/build_legislators.py
      - name: Commit if the roster changed
        run: |
          if git diff --quiet -I '"updated"' -- data/legislators.json; then
            echo "No roster changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/legislators.json
          git commit -m "Refresh legislator roster from Open States"
          git push
